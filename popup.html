<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube字幕翻译器</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup"><main>
<h1>YouTube字幕翻译器</h1><p class="note">多语言 → 简体中文 · 电脑端</p>
<label class="check"><input id="enabled" type="checkbox">启用字幕翻译</label>
<label for="mode">翻译模式</label><select id="mode"><option value="youtube">YouTube 自带翻译 · 无需密钥</option><option value="ai">AI 翻译现有字幕 · 需要密钥</option></select>
<p class="note">自动选择原始字幕语言 → 简体中文。<br>AI 模式保留英文人名；YouTube 模式的人名翻译由网站决定。</p>
<label class="check"><input id="bilingual" type="checkbox">同时显示原文（AI 模式）</label>
<div class="status" id="status" role="status" aria-live="polite">正在读取状态…</div>
<button id="reload">重新读取字幕</button>
<details><summary>字幕显示设置</summary>
<div class="row"><div><label for="fontSize">字号（px）</label><input id="fontSize" type="number" min="16" max="48"></div><div><label for="bottom">距底部（%）</label><input id="bottom" type="number" min="5" max="45"></div></div>
<label for="offset">AI 时间轴偏移（秒）</label><input id="offset" type="number" min="-10" max="10" step="0.1"><small>正数使字幕推迟；仅用于成功下载字幕的 AI 模式。</small>

</details><footer><button id="settings">API 设置</button><span class="note">v0.1.2 测试版</span></footer>
<script src="core.js"></script><script src="popup.js"></script></main></body></html>
